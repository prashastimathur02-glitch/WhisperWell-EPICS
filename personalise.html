            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 0.2;
            z-index: -2;
        }

</head>

        const medicineWebsites = ["https://www.1mg.com/search/all?name=", "https://www.netmeds.com/catalogsearch/result/?q=", "https://pharmeasy.in/search/all?name="];
        
        function generateTreatment() {
            const disease = document.getElementById("diseaseInput").value.trim().toLowerCase();
            const resultDiv = document.getElementById("result");
            
            if (!disease) {
                alert("Please enter a condition.");
                return;
            }
            
            if (medicineDatabase[disease]) {
                displayResults(disease, medicineDatabase[disease]);
            } else {
                resultDiv.innerHTML = `
                    <div class="disease-section">
                        <div class="section-title">
                            <i class="fas fa-search"></i> NO TREATMENT FOUND
                        </div>
                        <div class="disease-description">
                            We couldn't find a treatment plan for "<strong>${disease}</strong>". 
                            Please try one of the available conditions below:
                        </div>
                        
                        <div style="margin-top: var(--space-4); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-2);">
                            ${Object.keys(medicineDatabase).slice(0, 12).map(condition => 
                                `<button onclick="document.getElementById('diseaseInput').value='${condition}'; generateTreatment();" 
                                        style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
                                               color: white; padding: var(--space-2); border-radius: var(--radius-lg); 
                                               cursor: pointer; transition: all 0.3s ease;" 
                                        onmouseover="this.style.background='rgba(255,255,255,0.2)'" 
                                        onmouseout="this.style.background='rgba(255,255,255,0.1)'">
                                    ${condition.replace('_', ' ').toUpperCase()}
                                </button>`
                            ).join('')}
                        </div>
                    </div>
                `;
            }
            resultDiv.style.display = "block";
        }
        
        function displayResults(disease, data) {
            const resultDiv = document.getElementById("result");
            let html = `
                <div class="disease-section">
                    <div class="section-title">
                        <i class="fas fa-stethoscope"></i> ${disease.toUpperCase()} TREATMENT PLAN
                    </div>
                    <div class="disease-description">
                        ${data.description}
                    </div>
                    
                    <div class="section-title">
                        <i class="fas fa-pills"></i> RECOMMENDED MEDICINES
                    </div>
            `;
            
            data.medicines.forEach((med, index) => {
                html += `
                    <div class="medicine-item">
                        <div class="medicine-header">
                            <div class="medicine-details">
                                <div class="medicine-name">
                                    <i class="fas fa-capsules"></i> ${med.name}
                                </div>
                                <div class="medicine-price">
                                    <i class="fas fa-rupee-sign"></i> ${med.price}
                                </div>
                            </div>
                            <button class="buy-btn" onclick="buyMedicine('${med.name}')">
                                <i class="fas fa-shopping-cart"></i> Buy Now
                            </button>
                        </div>
                        
                        <div class="medicine-info">
                            <div class="info-item">
                                <div class="info-label">
                                    <i class="fas fa-clock"></i> Dosage
                                </div>
                                <div class="info-value">${med.dosage}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">
                                    <i class="fas fa-hashtag"></i> Medicine #${index + 1}
                                </div>
                                <div class="info-value">Primary Treatment</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += `
                    <div class="warning-box">
                        <strong><i class="fas fa-exclamation-triangle"></i> Important Medical Disclaimer:</strong>
                        <br><br>
                        This is an AI-generated treatment suggestion for informational purposes only. 
                        <strong>Always consult a qualified healthcare professional</strong> before starting any medication. 
                        Dosages and treatments may vary based on your individual health condition, age, weight, and medical history.
                    </div>
                </div>
            `;
            
            resultDiv.innerHTML = html;
        }
        
        function buyMedicine(name) {
            const url = medicineWebsites[Math.floor(Math.random() * medicineWebsites.length)] + encodeURIComponent(name);
            if (confirm(`Buy ${name}? You'll be redirected to an online pharmacy.`)) {
                window.open(url, '_blank');
            }
        }
        
        function startVoiceInput() {
            if ('webkitSpeechRecognition' in window) {
                const recognition = new webkitSpeechRecognition();
                recognition.onresult = function(event) {
                    document.getElementById("diseaseInput").value = event.results[0][0].transcript;
                };
                recognition.start();
            } else {
                alert('Speech recognition not supported.');
            }
        }
        
        document.getElementById('diseaseInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateTreatment();
        });
    </script>
