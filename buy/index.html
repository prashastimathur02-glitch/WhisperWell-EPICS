<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Marketplace</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
    .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h3 { margin-top: 0; }
    .btn { background-color: #3b82f6; color: white; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; }
    .btn:hover { background-color: #2563eb; }
  </style>
</head>
<body>
  <h1>AI Marketplace</h1>
  <div id="models" class="container"></div>

  <script>
    const token = localStorage.getItem("token"); // Set token after login

    // Fetch AI Models
    fetch("http://localhost:5000/api/models")
      .then(res => res.json())
      .then(models => {
        const container = document.getElementById("models");
        models.forEach(model => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <h3>${model.name}</h3>
            <p>${model.description}</p>
            <p><strong>Price:</strong> ${model.price} tokens</p>
            <button class="btn" onclick="buyModel('${model._id}')">Buy</button>
          `;
          container.appendChild(div);
        });
      });

    // Buy AI Model
    function buyModel(modelId) {
      fetch("http://localhost:5000/api/transactions/buy", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-auth-token": token
        },
        body: JSON.stringify({ modelId })
      })
      .then(res => res.json())
      .then(data => {
        if (data.transaction) {
          alert("Purchase successful: " + data.transaction._id);
        } else {
          alert("Error: " + data.msg);
        }
      })
      .catch(err => {
        console.error(err);
        alert("Purchase failed.");
      });
    }
  </script>
</body>
</html>
