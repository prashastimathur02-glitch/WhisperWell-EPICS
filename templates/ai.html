<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedBot AI - WhisperWell | Intelligent Health Assistant</title>
    <meta name="description" content="Chat with MedBot AI - Your intelligent health assistant providing instant medical guidance and personalized health recommendations 24/7.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root {
            /* WhisperWell Design System */
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --warning-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --danger-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --dark-gradient: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Monaco', 'Menlo', monospace;
            
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-16: 4rem;
            
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-2xl: 32px;
            --radius-full: 9999px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-primary);
            background: var(--primary-gradient);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
        }
        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(120, 219, 255, 0.3) 0%, transparent 50%);
            animation: backgroundFloat 20s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes backgroundFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(30px, -30px) rotate(120deg) scale(1.1); }
            66% { transform: translate(-20px, 20px) rotate(240deg) scale(0.9); }
        }
        
        /* Chat Interface */
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 80vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .chat-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--secondary-gradient);
        }
        .chat-header {
            display: flex;
            align-items: center;
            padding: var(--space-6);
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--glass-border);
        }
        
        .bot-avatar {
            width: 50px;
            height: 50px;
            background: var(--secondary-gradient);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin-right: var(--space-4);
            animation: botPulse 2s ease-in-out infinite;
        }
        
        @keyframes botPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .bot-info h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin: 0;
        }
        
        .bot-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin: var(--space-2) 0 0;
        }
        
        .home-btn {
            margin-left: auto;
            background: var(--warning-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-full);
            padding: var(--space-3) var(--space-6);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-6);
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 3px;
        }
        
        .message {
            max-width: 75%;
            padding: var(--space-4) var(--space-6);
            border-radius: var(--radius-xl);
            word-wrap: break-word;
            display: flex;
            align-items: flex-start;
            gap: var(--space-3);
            position: relative;
            animation: messageSlideIn 0.4s ease-out;
        }
        
        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user-message {
            align-self: flex-end;
            background: var(--primary-gradient);
            color: white;
            margin-left: auto;
        }
        
        .ai-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .message-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .message-content {
            flex: 1;
            line-height: 1.6;
        }
        
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            color: rgba(255, 255, 255, 0.7);
        }
        
        .thinking-dots {
            display: flex;
            gap: 4px;
        }
        
        .thinking-dots span {
            width: 6px;
            height: 6px;
            background: var(--secondary-gradient);
            border-radius: 50%;
            animation: thinkingPulse 1.5s ease-in-out infinite;
        }
        
        .thinking-dots span:nth-child(2) {
            animation-delay: 0.3s;
        }
        
        .thinking-dots span:nth-child(3) {
            animation-delay: 0.6s;
        }
        
        @keyframes thinkingPulse {
            0%, 60%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            30% {
                transform: scale(1.4);
                opacity: 0.7;
            }
        }
        .chat-input {
            display: flex;
            align-items: center;
            padding: var(--space-6);
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid var(--glass-border);
            gap: var(--space-3);
        }
        
        .input-field {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-full);
            padding: var(--space-4) var(--space-6);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .input-field:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        
        .send-btn {
            width: 50px;
            height: 50px;
            background: var(--secondary-gradient);
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            transition: all 0.3s ease;
        }
        
        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: var(--space-2);
            }
            
            .chat-container {
                height: 90vh;
                max-width: 100%;
            }
            
            .chat-header {
                padding: var(--space-4);
            }
            
            .bot-info h2 {
                font-size: 1.25rem;
            }
            
            .message {
                max-width: 85%;
                padding: var(--space-3) var(--space-4);
            }
        }
    </style>
</head>
<body>
    <div class="chat-container" data-aos="fade-up">
        <div class="chat-header">
            <div class="bot-avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div class="bot-info">
                <h2>MedBot AI</h2>
                <p>Your intelligent health assistant â€¢ Online</p>
            </div>
            <button class="home-btn" onclick="goHome()">
                <i class="fas fa-home"></i>
                Home
            </button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be dynamically added here -->
        </div>
        
        <div class="chat-input">
            <input 
                type="text" 
                id="user-input" 
                class="input-field" 
                placeholder="Ask me anything about your health..." 
                onkeypress="checkEnter(event)"
            >
            <button class="send-btn" onclick="sendMessage()" id="send-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
    <!-- JavaScript -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize AOS animations
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });

        function displayWelcomeMessage() {
            const chatMessages = document.getElementById("chat-messages");
            const welcomeMessage = document.createElement("div");
            welcomeMessage.className = "message ai-message";
            welcomeMessage.innerHTML = `
                <div class="message-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    Welcome to MedBot AI! ðŸ‘‹<br><br>
                    I'm your intelligent health assistant, here to help you with:
                    <br>â€¢ Medical questions and guidance
                    <br>â€¢ Health symptoms analysis
                    <br>â€¢ Wellness recommendations
                    <br>â€¢ Self-care tips and routines
                    <br><br>
                    How can I assist you today?
                </div>
            `;
            chatMessages.appendChild(welcomeMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById("user-input");
            const chatMessages = document.getElementById("chat-messages");
            const sendBtn = document.getElementById("send-btn");
            const userText = input.value.trim();
            
            if (userText === "") return;

            // Disable send button
            sendBtn.disabled = true;

            // Display user message
            const userMessage = document.createElement("div");
            userMessage.className = "message user-message";
            userMessage.innerHTML = `
                <div class="message-icon">
                    <i class="fas fa-user"></i>
                </div>
                <div class="message-content">${userText}</div>
            `;
            chatMessages.appendChild(userMessage);
            input.value = "";

            // Display thinking indicator
            const thinkingMessage = document.createElement("div");
            thinkingMessage.className = "message ai-message";
            thinkingMessage.id = "thinking-message";
            thinkingMessage.innerHTML = `
                <div class="message-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="thinking-indicator">
                        <span>MedBot is analyzing...</span>
                        <div class="thinking-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(thinkingMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Send request to backend
            fetch("http://127.0.0.1:5000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userText })
            })
            .then(response => response.json())
            .then(data => {
                // Remove thinking indicator
                const thinkingElement = document.getElementById("thinking-message");
                if (thinkingElement) {
                    chatMessages.removeChild(thinkingElement);
                }
                
                // Display AI response
                const aiMessage = document.createElement("div");
                aiMessage.className = "message ai-message";
                aiMessage.innerHTML = `
                    <div class="message-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">${data.response || "I'm sorry, I couldn't process your request right now. Please try again."}</div>
                `;
                chatMessages.appendChild(aiMessage);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            })
            .catch(error => {
                console.error("Fetch error:", error);
                
                // Remove thinking indicator
                const thinkingElement = document.getElementById("thinking-message");
                if (thinkingElement) {
                    chatMessages.removeChild(thinkingElement);
                }
                
                // Display error message
                const errorMessage = document.createElement("div");
                errorMessage.className = "message ai-message";
                errorMessage.innerHTML = `
                    <div class="message-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="message-content">
                        ðŸ”§ Server is currently offline. Please restart the Flask backend to continue chatting.
                        <br><br>
                        <small>Technical info: Connection to http://127.0.0.1:5000 failed</small>
                    </div>
                `;
                chatMessages.appendChild(errorMessage);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            })
            .finally(() => {
                // Re-enable send button
                sendBtn.disabled = false;
                input.focus();
            });
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function goHome() {
            window.location.href = "index.html";
        }

        // Initialize welcome message on page load
        window.addEventListener('load', () => {
            displayWelcomeMessage();
            document.getElementById('user-input').focus();
        });
    </script>
</body>
</html>
